name: AHUTong

options:
  minimumXcodeGenVersion: 2.45.4
  bundleIdPrefix: com.openahu
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
  indentWidth: 4
  tabWidth: 4
  usesTabs: false
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  AHUTong:
    type: application
    platform: iOS
    sources:
      - path: AHUTong
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openahu.ahutong
        PRODUCT_NAME: AHUTong
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        VERSIONING_SYSTEM: apple-generic
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 安大通
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 用于按当前位置查询本地天气；拒绝后仍可使用 IP 定位或城市搜索。
        # Keep device builds installable until the real iOS app icon set is migrated.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - AHUTongTests
        - AHUTongUITests
      gatherCoverageData: true
      coverageTargets:
        - AHUTong

  AHUTongTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AHUTongTests
    dependencies:
      - target: AHUTong
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openahu.ahutong.tests
        GENERATE_INFOPLIST_FILE: YES
  AHUTongUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AHUTongUITests
    dependencies:
      - target: AHUTong
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openahu.ahutong.uitests
        GENERATE_INFOPLIST_FILE: YES
