name: AHUTong

options:
  minimumXcodeGenVersion: 2.45.4
  bundleIdPrefix: com.openahu
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
  indentWidth: 4
  tabWidth: 4
  usesTabs: false
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  AHUTong:
    type: application
    platform: iOS
    sources:
      - path: AHUTong
      - path: Vendor/GuiXu-Rust/LICENSE
        buildPhase: resources
      - path: Vendor/GuiXu-Rust/NOTICE
        buildPhase: resources
    dependencies:
      - target: AHUTongWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openahu.ahutong
        PRODUCT_NAME: AHUTong
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        VERSIONING_SYSTEM: apple-generic
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AHUTong/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: AHUTong/Support/AHUTong-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: AHUTong/AHUTong.entitlements
        LIBRARY_SEARCH_PATHS: "$(inherited) $(BUILT_PRODUCTS_DIR)"
        OTHER_LDFLAGS: "$(inherited) -lahutong_rs -framework Security -framework SystemConfiguration -framework CoreFoundation -liconv -lresolv"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build fixed Rust campus SDK
        script: |
          "$SRCROOT/scripts/build-rust-ios.sh"
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - AHUTongTests
        - AHUTongUITests
      gatherCoverageData: true
      coverageTargets:
        - AHUTong

  AHUTongWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AHUTongWidget
      - path: AHUTong/Core/Widget
      - path: AHUTong/Core/Models/Course.swift
      - path: AHUTong/Core/LiveActivity/CourseActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openahu.ahutong.widget
        PRODUCT_NAME: AHUTongWidget
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: AHUTongWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: AHUTongWidget/AHUTongWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  AHUTongTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AHUTongTests
    dependencies:
      - target: AHUTong
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openahu.ahutong.tests
        GENERATE_INFOPLIST_FILE: YES
  AHUTongUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AHUTongUITests
    dependencies:
      - target: AHUTong
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openahu.ahutong.uitests
        GENERATE_INFOPLIST_FILE: YES
