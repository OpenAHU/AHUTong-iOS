name: iOS CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    name: Test ${{ matrix.suite }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, ui-navigation, ui-services, ui-settings]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust campus SDK
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Vendor/sdk

      - name: Test Rust SDK
        if: matrix.suite == 'unit'
        run: cargo test --manifest-path Vendor/sdk/Cargo.toml --all-features

      - name: Test artifact verification
        if: matrix.suite == 'unit'
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Block live campus and payment hosts during automated tests
        shell: bash
        run: |
          set -euo pipefail
          printf '127.0.0.1 one.ahu.edu.cn jw.ahu.edu.cn adwmh.ahu.edu.cn ycard.ahu.edu.cn epay92.ahu.edu.cn\n' | sudo tee -a /etc/hosts >/dev/null
          echo 'AHUTONG_CI_DISABLE_LIVE_PAYMENT=1' >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: |
          xcodegen --version
          xcodegen generate --spec project.yml

      - name: Create an isolated iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          runtime_identifier="$(
            xcrun simctl list runtimes available --json |
              jq -r '[.runtimes[] | select(.identifier | contains("iOS"))][-1].identifier // empty'
          )"
          test -n "$runtime_identifier"
          simulator_udid="$(xcrun simctl create 'AHUTong CI' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$runtime_identifier")"
          echo "SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b
          xcrun simctl ui "$simulator_udid" appearance light

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          test_options=()
          case '${{ matrix.suite }}' in
            unit)
              test_options=(-only-testing:AHUTongTests)
              ;;
            ui-navigation)
              for test in testAndroidParityPrimaryScreens testScheduleSupportsHorizontalWeekPaging testDeclinedPrivacyUsesScheduleOnlyExperienceAccount testNativeNavigationBarEdgeAndContentPopGestures testCompactHomeWeatherOpensWeatherInsteadOfSchedule; do
                test_options+=("-only-testing:AHUTongUITests/AppShellUITests/$test")
              done
              ;;
            ui-services)
              for test in testAndroidParityLoginAndReminderSystemStates testAndroidParityLoadingEmptyAndErrorStates testAndroidParityPaymentsAndOperations testNetworkRechargeAndCMBPreference; do
                test_options+=("-only-testing:AHUTongUITests/AppShellUITests/$test")
              done
              test_options+=(-only-testing:AHUTongUITests/PaymentLocalParityUITests -only-testing:AHUTongUITests/CampusCardPriorityUITests)
              ;;
            ui-settings)
              test_options=(-only-testing:AHUTongUITests -skip-testing:AHUTongUITests/AppShellUITests -skip-testing:AHUTongUITests/PaymentLocalParityUITests -skip-testing:AHUTongUITests/CampusCardPriorityUITests)
              ;;
          esac
          xcodebuild \
            -project AHUTong.xcodeproj \
            -scheme AHUTong \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -resultBundlePath "$RUNNER_TEMP/AHUTong.xcresult" \
            -parallel-testing-enabled NO \
            "${test_options[@]}" \
            test

      - name: Upload UI parity screenshots and test result
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/UIParityAttachments"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/AHUTong.xcresult" \
            --output-path "$RUNNER_TEMP/UIParityAttachments" || true

      - name: Upload UI parity evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: AHUTong-${{ matrix.suite }}-xcresult-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/AHUTong.xcresult
            ${{ runner.temp }}/UIParityAttachments
          if-no-files-found: warn
          retention-days: 7
