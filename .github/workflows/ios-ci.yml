name: iOS CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust campus SDK
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Vendor/sdk

      - name: Probe official school payment portal without charging
        shell: bash
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/ycard-head.txt"
          curl \
            --silent \
            --show-error \
            --fail \
            --retry 2 \
            --retry-all-errors \
            --head \
            --max-redirs 0 \
            --dump-header "$headers" \
            --output /dev/null \
            'https://ycard.ahu.edu.cn/berserker-auth/cas/redirect/neusoftCas?targetUrl=https%3A%2F%2Fycard.ahu.edu.cn%2Fplat%2F%3Fname%3DloginTransit'
          grep -Eq '^HTTP/[^ ]+ 302' "$headers"
          python3 - "$headers" <<'PY'
          import sys
          from pathlib import Path
          from urllib.parse import parse_qsl, urlsplit

          lines = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          locations = [
              line.split(":", 1)[1].strip()
              for line in lines
              if line.lower().startswith("location:")
          ]
          assert len(locations) == 1
          redirect = urlsplit(locations[0])
          assert redirect.scheme == "https"
          assert redirect.hostname == "ycard.ahu.edu.cn"
          assert redirect.port in (None, 443)
          assert redirect.username is None and redirect.password is None
          assert redirect.path == "/berserker-auth/cas/login/neusoftCas"
          assert redirect.fragment == ""
          outer = parse_qsl(redirect.query, keep_blank_values=True)
          assert len(outer) == 1 and outer[0][0] == "redirectUrl"
          target = urlsplit(outer[0][1])
          assert target.scheme == "https"
          assert target.hostname == "ycard.ahu.edu.cn"
          assert target.port in (None, 443)
          assert target.username is None and target.password is None
          assert target.path == "/plat/" and target.fragment == ""
          assert parse_qsl(target.query, keep_blank_values=True) == [
              ("name", "loginTransit")
          ]
          PY

      - name: Generate Xcode project
        run: |
          xcodegen --version
          xcodegen generate --spec project.yml

      - name: Select an available iOS Simulator
        shell: bash
        run: |
          runtime_identifier="$(
            xcrun simctl list runtimes available --json |
              jq -r '[.runtimes[] | select(.identifier | contains("iOS"))][-1].identifier'
          )"
          device_type_identifier="$(
            xcrun simctl list devicetypes --json |
              jq -r '([.devicetypes[] | select(.name == "iPhone 13 Pro")][0].identifier) // empty'
          )"
          simulator_udid="$(
            xcrun simctl list devices available --json |
              jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[]][0].udid // empty'
          )"

          if [[ -n "$device_type_identifier" && -n "$runtime_identifier" ]]; then
            existing_13_pro="$(
              xcrun simctl list devices available --json |
                jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name == "iPhone 13 Pro")][0].udid // empty'
            )"
            if [[ -n "$existing_13_pro" ]]; then
              simulator_udid="$existing_13_pro"
            else
              simulator_udid="$(xcrun simctl create "AHUTong iPhone 13 Pro" "$device_type_identifier" "$runtime_identifier")"
            fi
          fi

          if [[ -z "$simulator_udid" || "$simulator_udid" == "null" ]]; then
            echo "No available iOS Simulator was found." >&2
            exit 1
          fi

          echo "SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$simulator_udid" || true

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project AHUTong.xcodeproj \
            -scheme AHUTong \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -resultBundlePath "$RUNNER_TEMP/AHUTong.xcresult" \
            test

      - name: Upload UI parity screenshots and test result
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/UIParityAttachments"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/AHUTong.xcresult" \
            --output-path "$RUNNER_TEMP/UIParityAttachments" || true

      - name: Upload UI parity evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: AHUTong-ui-parity-xcresult-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/AHUTong.xcresult
            ${{ runner.temp }}/UIParityAttachments
          if-no-files-found: warn
          retention-days: 7
