name: iOS CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen --version
          xcodegen generate --spec project.yml

      - name: Select an available iOS Simulator
        shell: bash
        run: |
          simulator_udid="$(
            xcrun simctl list devices available --json |
              jq -r '(
                [.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name == "iPhone 13 Pro")][0].udid
              ) // ([.devices | to_entries[] | select(.key | contains("iOS")) | .value[]][0].udid)'
          )"

          if [[ -z "$simulator_udid" || "$simulator_udid" == "null" ]]; then
            echo "No available iOS Simulator was found." >&2
            exit 1
          fi

          echo "SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$simulator_udid" || true

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project AHUTong.xcodeproj \
            -scheme AHUTong \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -resultBundlePath "$RUNNER_TEMP/AHUTong.xcresult" \
            test

      - name: Upload UI parity screenshots and test result
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/UIParityAttachments"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/AHUTong.xcresult" \
            --output-path "$RUNNER_TEMP/UIParityAttachments" || true

      - name: Upload UI parity evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: AHUTong-ui-parity-xcresult-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/AHUTong.xcresult
            ${{ runner.temp }}/UIParityAttachments
          if-no-files-found: warn
          retention-days: 7
