name: Build unsigned IPA

run-name: "Unsigned IPA #${{ github.run_number }}"

on:
  push:
    branches:
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    name: Build unsigned device IPA
    runs-on: macos-26
    timeout-minutes: 30
    env:
      AHUTONG_ACTIONS_RUN_NUMBER: ${{ github.run_number }}
      SENTRY_TOKEN_CONFIGURED: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust campus SDK
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Vendor/sdk

      - name: Generate Xcode project
        run: |
          xcodegen --version
          xcodegen generate --spec project.yml

      - name: Configure required canteen contribution
        env:
          CANTEEN_WRITE_KEY: ${{ secrets.CANTEEN_WRITE_KEY }}
        run: python3 scripts/configure-canteen-key.py "$RUNNER_TEMP/Canteen.xcconfig.local" --require-key

      - name: Build unsigned Release archive for iPhone
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project AHUTong.xcodeproj \
            -scheme AHUTong \
            -configuration Release \
            -xcconfig "$RUNNER_TEMP/Canteen.xcconfig.local" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -archivePath "$RUNNER_TEMP/AHUTong.xcarchive" \
            AHUTONG_ACTIONS_RUN_NUMBER="$AHUTONG_ACTIONS_RUN_NUMBER" \
            ENABLE_CODE_COVERAGE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive

      - name: Verify built contribution configuration
        env:
          CANTEEN_WRITE_KEY: ${{ secrets.CANTEEN_WRITE_KEY }}
        run: python3 scripts/configure-canteen-key.py "$RUNNER_TEMP/AHUTong.xcarchive/Products/Applications/AHUTong.app" --verify-app --require-key

      - name: Package unsigned IPA
        id: package
        shell: bash
        run: |
          set -euo pipefail

          app_path="$RUNNER_TEMP/AHUTong.xcarchive/Products/Applications/AHUTong.app"

          if [[ ! -d "$app_path" ]]; then
            echo "No .app bundle was produced at $app_path" >&2
            exit 1
          fi

          ipa_path="$RUNNER_TEMP/AHUTong-unsigned.ipa"
          checksum_path="$RUNNER_TEMP/AHUTong-unsigned.ipa.sha256"

          python3 scripts/package-resignable-ipa.py "$app_path" "$ipa_path" --require-release

          shasum -a 256 "$ipa_path" > "$checksum_path"
          unzip -t "$ipa_path"
          python3 scripts/verify-widget-bundle.py "$ipa_path" --require-entitlements --require-release
          unzip -l "$ipa_path"

          echo "ipa_path=$ipa_path" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$checksum_path" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AHUTong-unsigned-ipa-${{ github.run_number }}
          path: |
            ${{ steps.package.outputs.ipa_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Preserve matching debug symbols
        uses: actions/upload-artifact@v6
        with:
          name: AHUTong-dSYMs-${{ github.run_number }}
          path: ${{ runner.temp }}/AHUTong.xcarchive/dSYMs/*.dSYM
          if-no-files-found: error
          retention-days: 30

      - name: Install official Sentry CLI
        if: env.SENTRY_TOKEN_CONFIGURED == 'true'
        run: brew install getsentry/tools/sentry-cli

      - name: Upload matching debug symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bash scripts/upload-sentry-symbols.sh "$RUNNER_TEMP/AHUTong.xcarchive/dSYMs"
